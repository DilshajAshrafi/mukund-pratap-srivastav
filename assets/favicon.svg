<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Burgundy to Reddish Copper to Gold Texture Gradient -->
    <linearGradient id="mpsLuxeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1733" />
      <stop offset="35%" stop-color="#c86741" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#fdf5c4" />
    </linearGradient>

    <!-- Metallic Gold Texture Gradient -->
    <linearGradient id="goldTexture" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a741c" />
      <stop offset="25%" stop-color="#fdf5c4" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#7a1733" />
    </linearGradient>

    <!-- Copper Glow Filter -->
    <filter id="copperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Bluish Off Foundation -->
  <rect width="64" height="64" rx="16" fill="#09111a" />
  
  <!-- Outer Gold Texture Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldTexture)" stroke-width="2.2" opacity="0.95" />
  
  <!-- Monogram MPS in Burgundy, Copper & Gold Texture -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="url(#mpsLuxeGrad)" text-anchor="middle" letter-spacing="-0.5">MPS</text>
  
  <!-- Ivory Greenish Dot with Copper Glow -->
  <circle cx="50" cy="16" r="3.5" fill="#f2f7f2" stroke="#c86741" stroke-width="1.2" filter="url(#copperGlow)" />
</svg>
